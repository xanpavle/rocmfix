name: "🎮 GPU Report"
description: "Report a new AMD GPU or a working override value"
title: "[GPU] "
labels: ["gpu-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve ROCmFix! Please fill in as much as you can.
        **Tip:** Run `python rocmfix.py` and it will auto-generate this issue with your GPU info pre-filled!

  - type: input
    id: gpu-name
    attributes:
      label: GPU Name
      description: "e.g. RX 7800 XT, RX 6700 XT"
      placeholder: "RX 7800 XT"
    validations:
      required: true

  - type: input
    id: pci-id
    attributes:
      label: PCI Device ID
      description: "4 hex characters. Run `python rocmfix.py` to find yours."
      placeholder: "7470"
    validations:
      required: true

  - type: dropdown
    id: arch
    attributes:
      label: Architecture
      options:
        - RDNA4 (RX 9000 series)
        - RDNA3 (RX 7000 series)
        - RDNA2 (RX 6000 series)
        - RDNA1 (RX 5000 series)
        - Vega (RX Vega / Radeon VII)
        - Polaris (RX 400/500 series)
        - Integrated GPU (Ryzen iGPU)
        - Not sure
    validations:
      required: true

  - type: input
    id: gfx-target
    attributes:
      label: Real GFX Target
      description: "Run `rocminfo | grep gfx` on Linux, or check AMD docs. e.g. gfx1101"
      placeholder: "gfx1101"
    validations:
      required: false

  - type: input
    id: override
    attributes:
      label: Working Override Value
      description: "What HSA_OVERRIDE_GFX_VERSION value made it work? Leave blank if natively supported."
      placeholder: "11.0.0"
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11
        - Windows 10
        - Ubuntu 24.04
        - Ubuntu 22.04
        - Arch Linux
        - Fedora
        - Other Linux
        - macOS
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: What did you test with?
      multiple: true
      options:
        - llama.cpp (Vulkan)
        - llama.cpp (HIP/ROCm)
        - PyTorch (ROCm)
        - Stable Diffusion (ROCm)
        - Ollama
        - LM Studio
        - Other
    validations:
      required: true

  - type: textarea
    id: issues
    attributes:
      label: Known Issues
      description: "Anything that broke or behaved weirdly with this override?"
      placeholder: "Flash Attention crashes on large models"
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: "Driver version, ROCm version, anything else useful"
    validations:
      required: false
