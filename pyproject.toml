[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rocmfix"
version = "0.1.1"
description = "Auto-detect AMD GPUs and suggest ROCm HSA_OVERRIDE_GFX_VERSION values"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "YOUR NAME", email = "your@email.com" }
]
keywords = ["rocm", "amd", "gpu", "hip", "llama.cpp", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.scripts]
rocmfix = "rocmfix.cli:main"

[project.urls]
Homepage = "https://github.com/YOURNAME/rocmfix"
Issues = "https://github.com/YOURNAME/rocmfix/issues"
Repository = "https://github.com/YOURNAME/rocmfix"

[tool.setuptools.packages.find]
where = ["."]
include = ["rocmfix*"]
