[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rocmfix"
version = "0.1.7"
description = "Auto-detect AMD GPUs and suggest ROCm overrides"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "xanpavle" }
]
keywords = ["rocm", "amd", "gpu", "hip", "llama.cpp", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.scripts]
rocmfix = "rocmfix:main"

[project.urls]
Homepage = "https://github.com/xanpavle/rocmfix"
Issues = "https://github.com/xanpavle/rocmfix/issues"
Repository = "https://github.com/xanpavle/rocmfix"

[tool.setuptools]
py-modules = ["rocmfix"]